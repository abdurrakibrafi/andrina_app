workflows:
  android-ios-release:
    name: Android + iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - chatterbee
      vars:
        ANDROID_PACKAGE_NAME: "com.example.chatter_bee"
        IOS_BUNDLE_ID: "com.example.chatterBee"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Run tests
        script: flutter test

      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > keystore.jks

      - name: Create key.properties
        script: |
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../keystore.jks
          EOF

      - name: Move keystore
        script: mv keystore.jks android/

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=${CM_TAG#v} \
            --build-number=$BUILD_NUMBER

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=${CM_TAG#v} \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - motasimfuad99@gmail.com
        notify:
          success: true
          failure: true


## Flow এখন হবে:

#git tag v1.0.0 → git push origin v1.0.0
#↓
#Codemagic build
#↓
#Android → Google Play Internal ✅
#iOS     → TestFlight ✅